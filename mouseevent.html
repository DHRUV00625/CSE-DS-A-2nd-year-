<html lang="en">
<head>

    <title>Mouse Events</title>

    <style>
        #box {
            display: flex;

            background-color: aqua;
            margin: 200px 0 0 100px;
            border: 5px solid red;
            border-radius: 400px;

    <script>
        function eventcall() {
            alert("These are the mouse events");
        }

<body>

    <div id="box" onmouseover="eventcall()">
        This is section A
    </div>
    <div id="form">

            <label>keyup</label>

        </form>
    </div>

</body>
</html>
