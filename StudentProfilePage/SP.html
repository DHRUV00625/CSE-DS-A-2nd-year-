<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="SP.CSS">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
  <div class="the-title">
<h1>CSE-DS DASHBOARD</h1>
  </div>
   <div class="name-box1">
    <form id="studentForm">
        <input type="text" id="name" placeholder="Your Name">

        <input type="email" id="email" placeholder="Your Email">

        <input type="tel" id="phone" placeholder="Phone Number">

        <textarea id="message" placeholder="Your Message"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>

<div id="outputContainer" class="box2">
    <h3>Submitted Information:</h3>
    <p id="displayName">Name will appear here</p>
    <p id="displayEmail">Email will appear here</p>
    <p id="displayPhone">Phone Number will appear here</p>
    <p id="displayMessage">Message will appear here</p>
</div>

<script src="SP.js"></script>
</body>
</html>
