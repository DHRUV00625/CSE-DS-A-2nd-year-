<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>
    <link rel="stylesheet" href="keyboard_events.css">
</head>

<body>
    <div class="video-background-container">
  
  <video autoplay muted loop playsinline class="background-video">
    <source src="C:\Users\dhruv\Downloads\8675543-hd_1920_1080_30fps.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

    <div id="form">
        <form>
            <h2>Keyboard Events</h2>

            <label>Keydown</label>
            <input type="text" onkeyup="document.getElementById('form').style.backgroundColor=this.value" placeholder="Type a color">

            <label>Keyup</label>
            <input type="text" onkeyup="document.getElementById('form').style.background=this.value" id="keyup" name="keyup" placeholder="Type something man">

            <label>Keypress</label>
            <input type="text" onkeypress="document.getElementById('form').style.background=this.value" id="keypress" name="keypress" placeholder="Type something man">
        </form>
    </div>
<script src="keyboard_events.js" defer></script>
</body>
</html>
